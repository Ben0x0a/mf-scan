# WhatsApp (Android) — .crypt14 backups (AES-256-GCM over a zlib-compressed SQLite).
#
# Validated against a real Google Pixel 9a full-filesystem extraction (December 2025):
# every `*.db.crypt14` backup (msgstore and its increments, wa.db, chatsettingsbackup,
# commerce_backup) decrypted with a verifying GCM tag and inflated to SQLite.
#   • the key is the app's own `key` file, inside the extraction, not a keychain or
#     keystore dump: a Java-serialised byte array whose last 32 bytes are the AES key.
#     Every matching copy (`/data/data`, `/data/user/0`, …) is tried; the GCM tag picks.
#   • the nonce is read from each file's protobuf header; see
#     src/decrypt/cipher/whatsapp.rs.
#   • crypt15 (an end-to-end encrypted backup, keyed by a 64-digit code or a password
#     the device does not keep) is not covered.
# The backups sit in shared storage, `…/Android/media/com.whatsapp/WhatsApp/` on
# current Android and `/sdcard/WhatsApp/` on older devices; the glob covers both.

name: whatsapp-android
app: WhatsApp
platform: android
description: WhatsApp Android crypt14 backups (AES-256-GCM, key file from the extraction).

db:
  glob: "*WhatsApp/*.db.crypt14"

key:
  encoding: raw
  file: "*/com.whatsapp/files/key"

cipher:
  algorithm: whatsapp-crypt
  zlib: true
