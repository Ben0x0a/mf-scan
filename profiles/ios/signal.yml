# Signal (iOS) — GRDB database encrypted with SQLCipher 4.
#
# Signal iOS keeps its message database as a GRDB SQLite file in its App Group
# container, and the SQLCipher key spec in the keychain.
#
# Validated against a real iPhone full-filesystem extraction (Signal installed December
# 2025, keychain dumped by the acquisition tool):
#   • the keychain item is service `GRDBKeyChainService`, account
#     `GRDBDatabaseCipherKeySpec`. Older builds used `TSKeyChainService` /
#     `OWSDatabaseCipherKeySpec`; those are not matched here.
#   • its value is the 48-byte key spec: the 32-byte SQLCipher key, then the 16-byte salt.
#   • the database keeps its first 32 bytes in plaintext
#     (`PRAGMA cipher_plaintext_header_size = 32`), so the OS recognises it as SQLite;
#     the salt therefore comes from the key spec, not the file.
#   • SQLCipher 4 defaults otherwise: 4096-byte pages, HMAC-SHA512 (reserve 80).
# Uncommitted changes live in `signal.sqlite-wal`, encrypted the same way.

name: signal-ios
app: Signal
platform: ios
description: Signal iOS GRDB message database (SQLCipher 4, 32-byte plaintext header).

db:
  glob: "*/grdb/signal.sqlite"

key:
  encoding: raw
  keychain:
    service: GRDBKeyChainService
    account: GRDBDatabaseCipherKeySpec

cipher:
  algorithm: sqlcipher
  page_size: 4096
  kdf_iter: 256000
  hmac: sha512
  kdf: sha512
  plaintext_header_size: 32
