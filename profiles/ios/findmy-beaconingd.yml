# Find My, findmybeaconingd (iOS system daemon): SQLite databases with each page AES-256-OFB encrypted.
#
# Validated against a real iPhone full-filesystem extraction (December 2025): every
# `.db` in the daemon's folder decrypted and passed SQLite's integrity check.
#   • each database has its own 32-byte key, a keychain item in access group
#     `com.apple.findmy.findmybeaconingd` whose service names the store (e.g. `Storage`). The
#     profile matches the whole access group; page 1's SQLite magic picks the right key.
#   • the cipher is described in src/decrypt/cipher/page_ofb.rs.

name: findmy-beaconingd-ios
app: Find My (findmybeaconingd)
platform: ios
description: Find My findmybeaconingd databases (page-level AES-256-OFB, key per store).

db:
  glob: "*/db/com.apple.findmy.findmybeaconingd/*.db"

key:
  encoding: raw
  keychain:
    access_group: com.apple.findmy.findmybeaconingd

cipher:
  algorithm: page-aes-ofb
