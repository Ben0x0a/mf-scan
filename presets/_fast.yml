# _fast preset — loaded by --fast.
# Speed-oriented defaults: exclude media files and skip noisy path globs.
# CLI flags always override preset values; both --not-path and this preset's
# not_path list are applied together.
#
# Edit not_path to tune what --fast treats as noise for your cases.
# Each glob is matched against the entry's internal path (* matches any run
# including /, ? matches one character) — exactly like --not-path. There is no
# gitignore-style ** (a single * already crosses /). NOTE: "*/x/*" requires a
# literal / before x, so it does NOT match a path that *starts* with "x/" —
# each directory glob therefore has a root-level twin ("x/*") for the case
# where the extraction root is the directory's parent.
#
# See docs/presets.md for the full field reference.

exclude_media: true

not_path:
  # ── Android: compiled native libraries ───────────────────────────────────────
  # Shared objects (.so) — JNI/NDK native code, no searchable text.
  - "*.so"
  # ART/Dalvik compiled artefacts — no text, often large.
  - "*.odex"
  - "*.vdex"
  - "*.oat"
  - "*.art"
  # ART ahead-of-time cache directories.
  - "*/dalvik-cache/*"
  - "dalvik-cache/*"
  - "*/oat/*"
  - "oat/*"
  # Per-ABI native-library folders inside APKs / app data.
  - "*/lib/arm64-v8a/*"
  - "lib/arm64-v8a/*"
  - "*/lib/armeabi-v7a/*"
  - "lib/armeabi-v7a/*"
  - "*/lib/x86_64/*"
  - "lib/x86_64/*"
  - "*/lib/x86/*"
  - "lib/x86/*"
  # Android system and vendor library trees.
  - "*/system/lib/*"
  - "system/lib/*"
  - "*/system/lib64/*"
  - "system/lib64/*"
  - "*/vendor/lib/*"
  - "vendor/lib/*"
  - "*/vendor/lib64/*"
  - "vendor/lib64/*"

  # ── iOS / macOS: compiled binary libraries ───────────────────────────────────
  # Dynamic libraries — compiled Mach-O, no text content.
  - "*.dylib"
  # Compiled asset catalogs — binary, no searchable strings.
  - "*.car"
  # Compiled Interface Builder / XIB files.
  - "*.nib"
  # iOS system and user-space library trees (full-filesystem acquisitions).
  - "*/System/Library/*"
  - "System/Library/*"
  - "*/usr/lib/*"
  - "usr/lib/*"
  - "*/usr/libexec/*"
  - "usr/libexec/*"
  # Bundled frameworks inside apps (.framework bundles contain the Mach-O binary).
  - "*/Frameworks/*.framework/Versions/*"
  - "Frameworks/*.framework/Versions/*"
  - "*/Frameworks/*.framework/Headers/*"
  - "Frameworks/*.framework/Headers/*"
  - "*/Frameworks/*.framework/Modules/*"
  - "Frameworks/*.framework/Modules/*"
  # App extensions — compiled bundles, rarely contain plain-text evidence.
  - "*/PlugIns/*.appex/*"
  - "PlugIns/*.appex/*"
  # Code-signing artefacts — binary, no forensic text.
  - "*/_CodeSignature/*"
  - "_CodeSignature/*"
