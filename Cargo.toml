[package]
name = "mf-scan"
version = "0.7.2"
edition = "2024"
# Minimum supported Rust. 1.98 stabilised `slice::as_chunks`, which the hex, UTF-16
# and WAL-checksum decoders use so their fixed-size indices are checked at compile
# time instead of at run time. Declared explicitly so a build on an older toolchain
# fails with a clear message rather than an obscure "method not found".
rust-version = "1.98"
description = "Fast, forensic-aware search, export, and diff over mobile-acquisition archives and folders."
keywords = ["forensics", "zip", "grep", "search", "mobile"]
categories = ["command-line-utilities", "filesystem"]
license = "Apache-2.0"
repository = "https://github.com/Ben0x0a/MobileForensic-zipgrep"

[dependencies]
aes = "0.9.4"
# default features off: we only decrypt (the IV is read from the file), so we do
# not need the `getrandom`-backed nonce generation — dropping it keeps the build
# free of a duplicate `getrandom`.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0.102"
base64 = "0.22"
bzip2 = "0.6.1"
cbc = { version = "0.2.1", features = ["block-padding"] }
clap = { version = "4.6.1", features = ["derive"] }
# CRC-32 (ISO-HDLC) for ZIP entry integrity attestation on export. Already in the
# build as a flate2 transitive; declaring it direct adds no new compilation.
crc32fast = "1.4"
csv = "1.4.0"
flate2 = "1.1.9"
hmac = "0.13.0"
# statfs-based detection of remote (SMB/NFS) sources for --io-mode auto. Already
# in the build as a transitive dependency; declaring it direct adds no compile.
libc = "0.2"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
memmap2 = "0.9.10"
pbkdf2 = "0.13.0"
plist = "1.9.0"
quick-xml = "0.39.4"
rayon = "1.12.0"
regex = "1.12.3"
# Unicode simple case folding for `-i` on encoded search patterns (UTF-16, JSON, …),
# the same folding `regex` applies to the plain pattern. Already in the build as a
# dependency of `regex`.
regex-syntax = "0.8"
ruzstd = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9"
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["aes256", "bzip2", "ppmd"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
# The spill file for decoding a large Android backup: unnamed and deleted by the OS,
# on every platform. Already in the build as a test dependency.
tempfile = "3.27.0"
# Export name clashes: compare file names the way macOS does, which treats the
# composed and decomposed forms of an accented letter as one name. Adds `tinyvec`.
unicode-normalization = "0.1.26"

[dev-dependencies]
# Used by integration tests to fabricate DEFLATE streams (a normal dependency
# too, so this adds no compilation — integration-test crates only see dev-deps).
flate2 = "1.1.9"
