[package]
name = "mf-scan"
version = "0.4.0"
edition = "2024"
description = "Fast, forensic-aware search, export, and diff over mobile-acquisition archives and folders."
keywords = ["forensics", "zip", "grep", "search", "mobile"]
categories = ["command-line-utilities", "filesystem"]
license = "Apache-2.0"
repository = "https://github.com/Ben0x0a/MobileForensic-zipgrep"

[dependencies]
aes = "0.8"
# default features off: we only decrypt (the IV is read from the file), so we do
# not need the `getrandom`-backed nonce generation — dropping it keeps the build
# free of a duplicate `getrandom`.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0.102"
base64 = "0.22"
cbc = { version = "0.1", features = ["block-padding"] }
clap = { version = "4.6.1", features = ["derive"] }
# CRC-32 (ISO-HDLC) for ZIP entry integrity attestation on export. Already in the
# build as a flate2 transitive; declaring it direct adds no new compilation.
crc32fast = "1.4"
csv = "1.4.0"
flate2 = "1.1.9"
hmac = "0.12"
# statfs-based detection of remote (SMB/NFS) sources for --io-mode auto. Already
# in the build as a transitive dependency; declaring it direct adds no compile.
libc = "0.2"
memmap2 = "0.9.10"
pbkdf2 = "0.12"
plist = "1.9.0"
quick-xml = "0.39.4"
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
# Used by integration tests to fabricate DEFLATE streams (a normal dependency
# too, so this adds no compilation — integration-test crates only see dev-deps).
flate2 = "1.1.9"
tempfile = "3.27.0"
