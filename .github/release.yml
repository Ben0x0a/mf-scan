# Configures GitHub's auto-generated release notes (the `generate_release_notes`
# option in .github/workflows/release.yml). PRs merged since the previous tag are
# grouped into the sections below by their labels; first matching category wins.
# Apply the matching label to each PR so it lands in the right section.
changelog:
  exclude:
    # Keep noise out of the notes.
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Breaking Changes
      labels:
        - breaking
        - breaking-change
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Performance
      labels:
        - performance
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Maintenance
      labels:
        - chore
        - dependencies
        - refactor
    # Catch-all for PRs with none of the labels above (the `*` wildcard must
    # come last so labelled PRs match a specific section first).
    - title: Other Changes
      labels:
        - "*"
