name: CI

# Run formatting, lint, and test checks on every push and pull request so a
# broken change is caught before it lands. Edition 2024 needs a recent stable
# The GitHub-hosted toolchain tracks current stable, so a new clippy lint can turn
# CI red with no code change — as happened when 1.98 added `chunks_exact_to_as_chunks`.
# Keep a local toolchain at current stable (`rustup update stable`) so `scripts/check.sh`
# reproduces CI; the crate's floor is `rust-version` in Cargo.toml.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all
